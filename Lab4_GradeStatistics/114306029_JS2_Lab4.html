<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Grade Statistics </title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="container">
<h1>Grade Statistics</h1>
<div id="gradeInputForm">
<input type="number" id="mathInput" placeholder="數學成績" min="0" max="100">
<input type="number" id="englishInput" placeholder="英文成績" min="0" max="100">
<button id="submitBtn">Submit</button>
</div>
<table id="gradeTable">
<thead>
<tr>
<th>#</th>
<th>Math</th>
<th>English</th>
<th>Average</th>
</tr>
</thead>
<tbody id="tableBody">
<tr>
<td>1</td>
<td data-col="math">60</td>
<td data-col="english">70</td>
<td data-col="average">65.00</td>
</tr>
<tr>
<td>2</td>
<td data-col="math">100</td>
<td data-col="english">80</td>
<td data-col="average">90.00</td>
</tr>
<tr>
<td>3</td>
<td data-col="math">40</td>
<td data-col="english">70</td>
<td data-col="average">55.00</td>
</tr>
</tbody>


<tfoot>
<tr id="averageRow">
<td colspan="1">Average</td>
<td id="avgMath">--</td>
<td id="avgEnglish">--</td>
<td id="avgOverall">--</td>
</tr>
</tfoot>
</table>

</div>

<script src="script.js"></script>

</body>
</html>
